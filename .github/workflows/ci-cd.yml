# CI pipeline — GitOps edition.
#
#   Stage 1: pytest + flake8              <- quality gate #1
#   Stage 2: docker build + Trivy scan    <- quality gate #2 (DevSecOps)
#   Stage 3: push image (tag = git SHA)   <- immutable, traceable artifact
#   Stage 4: commit the new tag to helm/flask-app/values.yaml
#
# There is NO deploy job and NO kubeconfig secret. That is the point:
# v1 pushed to the cluster from CI (cluster-admin credentials living in an
# external system, no drift detection). v2 is pull-based — ArgoCD runs
# INSIDE the cluster, watches this repo, and syncs whatever Git says.
# Git is the single source of truth; `git revert` is the rollback button.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Required repo setting for Stage 4:
#   Settings -> Actions -> General -> Workflow permissions -> Read and write

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/flask-app/values.yaml"   # ignore the tag-bump commit -> no pipeline loop
      - "**.md"
  pull_request:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-capstone

jobs:
  test:
    name: "Stage 1 — Lint + unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Lint
        run: flake8 app --max-line-length=100
      - name: Run pytest
        run: cd app && python -m pytest -v

  build-scan-push:
    name: "Stage 2+3 — Build, Trivy scan, push"
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build image (tag = git SHA)
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push $IMAGE:${{ github.sha }}

  gitops-bump:
    name: "Stage 4 — Commit new tag (ArgoCD deploys it)"
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag in Helm values
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}            # set by CI (do not edit by hand)|" \
            helm/flask-app/values.yaml
          grep "tag:" helm/flask-app/values.yaml

            - name: Commit and push (the "deploy" is this commit)
             run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/flask-app/values.yaml
          git commit -m "release: image ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push
