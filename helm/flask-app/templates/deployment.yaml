apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime: capacity never drops during rollout
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Annotation-based scraping (works with a raw Prometheus scrape config,
        # e.g. the docker-compose stack). kube-prometheus-stack IGNORES these —
        # it discovers targets via the ServiceMonitor CRD instead
        # (templates/servicemonitor.yaml, enabled via values).
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true            # image runs as 'appuser'; enforce at pod level too
        seccompProfile:
          type: RuntimeDefault        # block unexpected syscalls
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # nothing writes to the image FS...
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
          volumeMounts:
            - name: tmp                    # ...except /tmp (gunicorn heartbeat +
              mountPath: /tmp              # prometheus multiprocess samples)
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:       # restarts a dead container
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelaySeconds }}
            periodSeconds: 10
          readinessProbe:      # gates traffic until the pod can serve
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelaySeconds }}
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
